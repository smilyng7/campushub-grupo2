
<div class="formulario-container">

  <h2>{{ editando ? 'Editar Laboratorio' : 'Registrar Laboratorio' }}</h2>

  <p>
    {{ editando
      ? 'Modifica los datos del laboratorio.'
      : 'Completa los datos del nuevo laboratorio.' }}
  </p>

  <div *ngIf="cargando">
    Cargando información del laboratorio...
  </div>

  <form *ngIf="!cargando" (ngSubmit)="guardar()">

    <label>Nombre del laboratorio</label>
    <input
      type="text"
      name="nombre"
      [(ngModel)]="laboratorio.nombre"
      placeholder="Ejemplo: Lab A-301"
      required
    >

    <label>Sede</label>
    <input
      type="text"
      name="sede"
      [(ngModel)]="laboratorio.sede"
      placeholder="Ejemplo: Lima Centro"
      required
    >

    <label>Capacidad</label>
    <input
      type="number"
      name="capacidad"
      [(ngModel)]="laboratorio.capacidad"
      min="1"
      required
    >

    <label>Equipos</label>
    <input
      type="text"
      name="equipos"
      [(ngModel)]="equiposTexto"
      placeholder="PC i7, Proyector, Arduino"
    >

    <small>Separa los equipos con comas.</small>

    <label>Estado</label>
    <select
      name="estado"
      [(ngModel)]="laboratorio.estado"
      required
    >
      <option value="disponible">Disponible</option>
      <option value="mantenimiento">Mantenimiento</option>
    </select>

    <div class="botones">

      <button
        type="submit"
        class="guardar"
        [disabled]="cargando"
      >
        {{ editando ? 'Actualizar laboratorio' : 'Guardar laboratorio' }}
      </button>

      <button
        type="button"
        class="cancelar"
        (click)="cancelar()"
      >
        Cancelar
      </button>

    </div>

  </form>

</div>
